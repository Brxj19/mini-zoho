<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <div style="max-width: 560px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 12px;">
      <p style="margin: 0 0 8px; font-size: 14px; color: #6b7280;">Northstar Inventory</p>
      <h1 style="margin: 0 0 16px; font-size: 24px;">{{ title }}</h1>
      <p style="margin: 0 0 16px;">{{ intro }}</p>
      <p style="margin: 0 0 16px;">Attached is your {{ document_kind|lower }} <strong>{{ document_number }}</strong>.</p>
      {% if notes %}
      <p style="margin: 0 0 16px;">Notes: {{ notes }}</p>
      {% endif %}
      <p style="margin: 0;">Thank you,<br>{{ sender_name }}</p>
    </div>
  </body>
</html>
