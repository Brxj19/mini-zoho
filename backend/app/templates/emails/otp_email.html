<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <div style="max-width: 560px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 12px;">
      <p style="margin: 0 0 8px; font-size: 14px; color: #6b7280;">Northstar Inventory</p>
      <h1 style="margin: 0 0 16px; font-size: 24px;">Verification code</h1>
      <p style="margin: 0 0 16px;">Use this code to complete your {{ purpose|lower }} request.</p>
      <div style="margin: 24px 0; padding: 16px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 8px; background: #f3f4f6; border-radius: 12px;">
        {{ code }}
      </div>
      <p style="margin: 0 0 12px;">This code expires in {{ ttl_minutes }} minutes.</p>
      <p style="margin: 0; font-size: 13px; color: #6b7280;">If you did not request this code, you can safely ignore this message.</p>
    </div>
  </body>
</html>
